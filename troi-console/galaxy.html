<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<style>
  :root { --bg: #03060b; --ink: #e8f3ff; --dim: #8fb0c4; --mute: #5f7d90; --line: rgba(140,220,255,.16); --accent: #7fdcff;
          --dir: #7fdcff; --code: #8affc1; --web: #ffb86b; --data: #d6a8ff; --doc: #ffd28a; --image: #ff9bd0; --audio: #9bffea;
          --video: #ff9b8a; --archive: #b8c4d0; --config: #9aa9b8; --model: #c7ff7f; --sheet: #7fffb0; --slides: #ffc27f; --file: #9fb6c8; --app: #ffd28a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
               font: 13px/1.4 ui-sans-serif, -apple-system, "Segoe UI", Inter, sans-serif; }
  canvas { position: fixed; inset: 0; display: block; }
  #sky { z-index: 0; } #c { z-index: 1; }
  .ui { position: fixed; z-index: 3; }
  #top { left: 18px; top: 16px; right: 18px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .crumbs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
  .crumbs button { all: unset; cursor: pointer; padding: 5px 11px; border-radius: 10px; background: rgba(8,16,26,.72); border: 1px solid var(--line); color: var(--ink);
                   backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: border-color .15s; }
  .crumbs button:hover { border-color: var(--accent); }
  .crumbs .sep { color: var(--mute); padding: 0 2px; }
  #search { margin-left: auto; padding: 7px 14px; width: 240px; border-radius: 12px; border: 1px solid var(--line); background: rgba(8,16,26,.72); color: var(--ink); font: inherit;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #search:focus { outline: none; border-color: var(--accent); }
  #legend { display: none !important; left: 18px; bottom: 16px; max-width: 45vw; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--dim); pointer-events: none; }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; box-shadow: 0 0 6px currentColor; }
  #hover { padding: 7px 11px; border-radius: 10px; background: rgba(6,12,18,.92); border: 1px solid var(--line); font-size: 12px; pointer-events: none; display: none; max-width: 440px; overflow-wrap: anywhere; }
  #hover small { color: var(--dim); }
  #peek { right: 18px; top: 60px; width: min(480px, 46vw); height: calc(100vh - 78px); display: flex; flex-direction: column;
          background: rgba(8,14,22,.84); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
          box-shadow: 0 24px 60px rgba(0,0,0,.5); animation: slide .25s cubic-bezier(.2,.8,.2,1); }
  @keyframes slide { from { opacity: 0; transform: translateX(16px);} to { opacity: 1; transform: none;} }
  #gdock { right: 18px; top: 96px; display: flex; gap: 6px; }
  #peek header { display: flex; gap: 8px; align-items: center; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  #peek header .pbtn { color: var(--dim); } #peek header .psp { flex: 0; }
  #peek header b { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 70px; direction: rtl; text-align: left; }
  #peek header button { all: unset; cursor: pointer; padding: 4px 8px; border-radius: 9px; border: 1px solid var(--line); color: var(--ink); font-size: 11px; white-space: nowrap; }
  #peek header button:hover { border-color: var(--accent); }
  #peek pre { margin: 0; padding: 14px; overflow: auto; flex: 1; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe6f5; white-space: pre-wrap; }
  #peek img { max-width: 100%; max-height: 100%; object-fit: contain; margin: auto; display: block; padding: 12px; }
  #pkbody { flex: 1; overflow: auto; }
  #pkbody .md { padding: 14px 18px; font-size: 13.5px; line-height: 1.55; color: #dbe9f4; }
  #pkbody .md h1, #pkbody .md h2, #pkbody .md h3 { color: #fff; margin: 1em 0 .4em; } #pkbody .md a { color: var(--accent); } #pkbody .md code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  #pkbody .md pre { background: rgba(0,0,0,.4); padding: 10px 12px; border-radius: 10px; overflow: auto; } #pkbody .md img { max-width: 100%; } #pkbody .md table { border-collapse: collapse; } #pkbody .md td, #pkbody .md th { border: 1px solid var(--line); padding: 4px 8px; }
  #pkbody pre.hljs { margin: 0; padding: 14px; font: 12px/1.5 ui-monospace, Menlo, monospace; background: transparent; }
  #pkbody table.csv { border-collapse: collapse; font: 12px ui-monospace, Menlo, monospace; margin: 12px; } #pkbody table.csv td, #pkbody table.csv th { border: 1px solid var(--line); padding: 3px 8px; white-space: nowrap; } #pkbody table.csv th { background: rgba(127,220,255,.12); position: sticky; top: 0; }
  #pkbody iframe, #pkbody video, #pkbody model-viewer { width: 100%; height: 100%; border: 0; background: #000; } #pkbody audio { width: calc(100% - 28px); margin: 40px 14px; }
  #pkbody .none { padding: 24px; color: var(--dim); text-align: center; } #pkbody .none button { all: unset; cursor: pointer; margin-top: 12px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--accent); color: var(--accent); }
  #pkkind { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  #hint { right: 18px; bottom: 16px; font-size: 11.5px; color: var(--mute); pointer-events: none; text-align: right; max-width: 60vw; }
  #hands { right: 18px; top: 60px; display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); }
  #hands button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 9px; border: 1px solid var(--line); color: var(--ink); background: rgba(8,16,26,.72); }
  #hands button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .hcur { position: fixed; z-index: 4; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 2px solid rgba(127,220,255,.9);
          box-shadow: 0 0 18px rgba(127,220,255,.6), inset 0 0 10px rgba(127,220,255,.25); pointer-events: none; transition: transform .08s, border-color .1s; }
  .hcur.pinch { transform: scale(.55); border-color: #8affc1; box-shadow: 0 0 20px rgba(138,255,193,.8); }
  .hcur .dw { position: absolute; inset: -6px; border-radius: 50%; background: conic-gradient(#8affc1 calc(var(--p, 0) * 360deg), transparent 0);
              -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); }
  #menu { padding: 6px; border-radius: 12px; background: rgba(6,12,18,.94); border: 1px solid var(--line); display: none; min-width: 200px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #menu.on { display: block; }
  #menu .t { font-size: 11px; color: var(--dim); padding: 4px 10px 6px; overflow-wrap: anywhere; max-width: 260px; }
  #menu button { all: unset; display: block; width: 100%; cursor: pointer; padding: 7px 10px; border-radius: 8px; font-size: 12.5px; color: var(--ink); }
  #menu button:hover { background: rgba(127,220,255,.14); }
  #menu button.warn { color: var(--video); }
  #recent { left: 18px; right: 18px; bottom: 44px; display: none; gap: 8px; overflow-x: auto; padding: 6px 2px; pointer-events: auto; scrollbar-width: none; }
  #recent.on { display: flex; }
  #recent .rc { flex: none; display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 12px; background: rgba(8,16,26,.72); border: 1px solid var(--line); cursor: pointer; font-size: 11.5px; max-width: 220px;
                backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #recent .rc:hover { border-color: var(--accent); }
  #recent .rc i { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 6px currentColor; }
  #recent .rc span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } #recent .rc small { color: var(--mute); flex: none; }
  #pkbody textarea { width: 100%; height: 100%; resize: none; border: 0; outline: none; padding: 14px; background: transparent; color: #dbe9f4; font: 12.5px/1.5 ui-monospace, Menlo, monospace; }
  #pkbody .apppeek { padding: 18px; display: grid; gap: 12px; justify-items: center; text-align: center; } #pkbody .apppeek img { width: 96px; height: 96px; border-radius: 22px; }
  #pkbody .apppeek button { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--accent); color: var(--accent); margin: 0 4px; } #pkbody .apppeek button.warn { border-color: var(--video); color: var(--video); }
  #mini { right: 18px; bottom: 100px; width: 180px; height: 120px; border-radius: 12px; background: rgba(8,16,26,.72); border: 1px solid var(--line); cursor: pointer; }
  #mini canvas { position: static; inset: auto; width: 100%; height: 100%; display: block; border-radius: 12px; }
  #mini button { position: absolute; right: 6px; top: 6px; all: unset; cursor: pointer; font-size: 10px; padding: 2px 7px; border-radius: 7px; border: 1px solid var(--line); color: var(--ink); background: rgba(8,16,26,.8); }
  #dbg { display: none; }
</style>
</head>

<script>if (new URLSearchParams(location.search).get("bg") === "deep") {   // the V2 console: full window, black ground, its bar over the bottom; keep the space tidy
  document.documentElement.style.setProperty("--bg", "#000");
  document.head.insertAdjacentHTML("beforeend", "<style>#mini,#hst{display:none!important}#hint{bottom:104px!important;opacity:0;transition:opacity .6s}#hint.on{opacity:1}"
    + "#recent{bottom:104px!important}#recent.on{display:none}body.recents #recent.on{display:flex}body.recents #hint{opacity:0!important}#rbtn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}</style>");
  addEventListener("DOMContentLoaded", () => {
    const hint = document.getElementById("hint"), hst = document.getElementById("hst"), hbtn = document.getElementById("hbtn"); let t = 0;
    new MutationObserver(() => { hint.classList.add("on"); clearTimeout(t); t = setTimeout(() => hint.classList.remove("on"), 4000); }).observe(hint, { childList: true, characterData: true, subtree: true });
    new MutationObserver(() => { hbtn.title = hst.textContent || "Hands"; }).observe(hst, { childList: true, characterData: true, subtree: true });
    const r = document.createElement("button"); r.id = "rbtn"; r.type = "button"; r.textContent = "Recent"; r.setAttribute("aria-pressed", "false"); hbtn.before(r);
    r.onclick = () => r.setAttribute("aria-pressed", String(document.body.classList.toggle("recents")));
  });
}</script>
<canvas id="sky"></canvas>
<canvas id="c"></canvas>
<div class="ui" id="top"><div class="crumbs" id="crumbs"></div><input id="search" placeholder="Find in this galaxy…" aria-label="Search"></div>
<div class="ui" id="hands"><span id="hst"></span><button id="hbtn" type="button" aria-pressed="false">Hands</button></div>
<div class="ui" id="gdock"></div>
<div class="ui" id="hover"></div>
<div class="ui" id="menu"><div class="t" id="mt"></div></div>
<aside class="ui" id="peek"><header class="ph"><span id="pkkind"></span><b id="pkname"></b><button id="pkedit" title="Edit this text file here" hidden>Edit</button><button id="pksave" hidden>Save</button><button id="pkapp" title="Open in its own application">Open in app</button><button id="pkask">Ask</button><button id="pkopen">Galaxy</button><button id="pkclose">Close</button></header><div id="pkbody"></div></aside>

<script src="/panes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark-dimmed.min.css">
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3/dist/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
let AGENT = "the agent";

const dbg = t => { const d = document.getElementById("dbg"); d.textContent = (d.textContent + " | " + t).slice(-500); };
addEventListener("error", e => { setHint("Page error: " + e.message); dbg("ERR " + e.message); });
addEventListener("unhandledrejection", e => { setHint("Page error: " + (e.reason && e.reason.message || e.reason)); dbg("REJ " + e.reason); });
if (typeof d3 === "undefined") document.getElementById("hint").textContent = "The layout library did not load (internet needed once).";

const KINDS = ["dir","code","web","data","doc","image","audio","video","archive","config","model","sheet","slides","file","app"];
const css = k => getComputedStyle(document.documentElement).getPropertyValue("--" + (KINDS.includes(k) ? k : "file")).trim();
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), sky = document.getElementById("sky"), sctx = sky.getContext("2d");
const DOCK_SAFE = new URLSearchParams(location.search).get("safe") === "0" ? 0 : 96;                       // the console's floating bar sits over the bottom: keep the ground clear of it
const DEEP = new URLSearchParams(location.search).get("bg") === "deep";                                  // the V2 console asks for a darker ground
let W = innerWidth, H = innerHeight - DOCK_SAFE, DPR = Math.min(2, devicePixelRatio || 1);
let stars = [];
function resize() {
  W = innerWidth; H = innerHeight - DOCK_SAFE;
  [cv, sky].forEach(c => { c.width = W * DPR; c.height = H * DPR; c.style.width = W + "px"; c.style.height = H + "px"; });
  stars = Array.from({ length: Math.round(W * H / 2600) }, () => ({ x: Math.random() * W * 1.6 - W * .3, y: Math.random() * H * 1.6 - H * .3,
           z: .3 + Math.random() * .7, r: Math.random() < .08 ? 1.4 : .7, tw: Math.random() * 6.28, h: Math.random() < .3 ? 200 : 40 }));
}
resize(); addEventListener("resize", () => { resize(); if (sim) sim.alpha(.3).restart(); });

let nodes = [], links = [], byPath = new Map(), sim = null, root = null, particles = [];
let view = { x: 0, y: 0, k: 1, rot: 0, tilt: 0 }, target = null, hover = null, focus = null, dragging = null, dwell = { n: null, p: 0 };
const q = new URLSearchParams(location.search);
const MODE = ["apps", "vault"].includes(q.get("mode")) ? q.get("mode") : "files";
const iconCache = new Map();
function iconImg(src) { if (!iconCache.has(src)) { const im = new Image(); im.src = src; iconCache.set(src, im); } return iconCache.get(src); }
// the Apps galaxy: categories orbit the centre, apps orbit their category; the whole tree comes from /apps
let APPSBY = {};
async function appsTree() {
  const list = (await (await fetch("/apps")).json()).apps; APPSBY = {};
  const cats = {};
  list.forEach(a => { (cats[a.category || "Other"] = cats[a.category || "Other"] || []).push(a); APPSBY[a.name] = a; });
  const children = Object.keys(cats).sort().map(c => ({ name: c, path: "apps://" + c, kind: "dir", apps: cats[c] }));
  return { name: "Silo One Apps", path: "apps://", kind: "dir", children, related: [] };
}
// the vault as a graph: every note a star, coloured by its folder, joined by its [[wikilinks]]
async function vaultGraph() {
  const g = await (await fetch("/vaultgraph")).json();
  return { name: AGENT + "'s memory", path: "vault://graph", kind: "dir", children: g.notes, related: g.links.map(l => ({ a: l.a, b: l.b, why: "wikilink" })), graph: true };
}
function appNode(a) { return { name: a.name, path: "app://" + a.name, kind: "app", icon: a.icon, running: a.running, size: 0 }; }
function setHint(t) { document.getElementById("hint").textContent = t; }
function fmt(b) { return b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : b > 1e3 ? (b / 1e3).toFixed(0) + " KB" : b + " B"; }
function hue(n) { let h = 0; for (const ch of (n.name || "")) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }

// ---- the graph
function addNode(n, parent) {
  if (byPath.has(n.path)) return byPath.get(n.path);
  const depth = parent ? parent.depth + 1 : 0;
  const o = { ...n, parent, depth, expanded: false, born: performance.now(), hue: hue(n),
              r: n.kind === "dir" ? Math.max(9, 15 - depth * 1.5) : n.kind === "app" ? 14 : 5.5 + Math.min(4, Math.log10((n.size || 1) + 1) * .8),
              x: parent ? parent.x + (Math.random() - .5) * 40 : W / 2, y: parent ? parent.y + (Math.random() - .5) * 40 : H / 2 };
  nodes.push(o); byPath.set(n.path, o);
  if (parent) links.push({ source: parent, target: o, t: "tree" });
  return o;
}
function removeSubtree(n) {
  (n.children || []).forEach(c => { const o = byPath.get(c.path); if (o) { removeSubtree(o); nodes = nodes.filter(x => x !== o); byPath.delete(o.path); } });
  links = links.filter(l => byPath.has(l.source.path) && byPath.has(l.target.path));
  n.expanded = false;
}
function addRelated(rel) { (rel || []).forEach(r => { const a = byPath.get(r.a), b = byPath.get(r.b); if (a && b) links.push({ source: a, target: b, t: "rel", why: r.why }); }); }
async function expand(n) {
  if (n.kind !== "dir" || n.expanded) return;
  const d = n.apps ? { children: n.apps.map(appNode), related: [], skipped: 0 } : await (await fetch("/tree?path=" + encodeURIComponent(n.path))).json();
  if (d.error) { setHint(d.error); return; }
  n.expanded = true; n.children = d.children; n.skipped = d.skipped;
  const ring = orbitRadius(n, d.children.length);
  d.children.forEach((c, i) => { const a = (i / d.children.length) * 6.283 + n.hue / 57; const o = addNode(c, n); o.x = n.x + Math.cos(a) * ring; o.y = n.y + Math.sin(a) * ring; });
  addRelated(d.related); restart();
}
function collapse(n) { removeSubtree(n); restart(); }
async function refresh(n) {
  // something changed inside an unfolded folder: add what is new, drop what is gone, keep everything else where it is
  if (MODE === "vault" && root && !root.graph) { loadVault(root.path); return; }
  if (!n || n.kind !== "dir" || !n.expanded) return;
  const d = await (await fetch("/tree?path=" + encodeURIComponent(n.path))).json();
  if (d.error) return;
  const now = new Set(d.children.map(c => c.path));
  (n.children || []).forEach(c => { if (!now.has(c.path)) { const o = byPath.get(c.path); if (o) { if (o.expanded) removeSubtree(o); nodes = nodes.filter(x => x !== o); byPath.delete(o.path); links = links.filter(l => l.source !== o && l.target !== o); if (focus === o) focus = null; } } });
  const ring = orbitRadius(n, d.children.length);
  d.children.forEach((c, i) => { if (!byPath.has(c.path)) { const a = (i / d.children.length) * 6.283 + n.hue / 57; const o = addNode(c, n); o.x = n.x + Math.cos(a) * ring; o.y = n.y + Math.sin(a) * ring; setHint("new: " + c.name); }
    else { const o = byPath.get(c.path); o.size = c.size; o.kind = c.kind; if (o.pinned) { o.fx = o.x; o.fy = o.y; } } });
  n.children = d.children; n.skipped = d.skipped;
  links = links.filter(l => l.t !== "rel" || (l.source.parent !== n && l.target.parent !== n)); addRelated(d.related);
  sim.nodes(nodes); sim.force("link").links(links); sim.alpha(.5).restart();
}
const mtimes = {};
async function watch() {
  if (MODE === "vault") {                      // the card wall: re-lay it out when the folder itself changes
    if (root && !root.graph && root.path) { try { const d = await (await fetch("/mtimes?p=" + encodeURIComponent(root.path))).json(); const mt = d[root.path];
      if (mtimes[root.path] !== undefined && mtimes[root.path] !== mt) loadVault(root.path); mtimes[root.path] = mt; } catch (e) {} }
    setTimeout(watch, 2000); return;
  }
  const dirs = nodes.filter(n => n.kind === "dir" && n.expanded && n.path && !n.path.startsWith("apps://") && !n.path.startsWith("vault://"));
  if (MODE === "apps") { try { const list = (await (await fetch("/apps")).json()).apps; list.forEach(a => { const o = byPath.get("app://" + a.name); if (o && o.running !== a.running) { o.running = a.running; } }); } catch (e) {} }
  if (dirs.length) {
    try {
      const d = await (await fetch("/mtimes?p=" + encodeURIComponent(dirs.map(n => n.path).join("|")))).json();
      for (const [pth, mt] of Object.entries(d)) { if (mtimes[pth] !== undefined && mtimes[pth] !== mt) refresh(byPath.get(pth)); mtimes[pth] = mt; }
    } catch (e) {}
  }
  setTimeout(watch, 2000);
}
function orbitRadius(n, count) { return Math.max(150, 40 + count * 17) / (1 + n.depth * .22); }
function orbitForce(alpha) {
  // each unfolded folder keeps its children on a ring around it: the galaxy's shells
  nodes.forEach(c => {
    const p = c.parent; if (!p || p.graph) return;                 // the memory graph is shaped by its links, not by orbits
    const R = orbitRadius(p, (p.children || []).length || 1);
    const dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1, k = (R - d) / d * alpha * .35;
    c.vx += dx * k; c.vy += dy * k;
  });
}
function restart() { sim.nodes(nodes); sim.force("link").links(links); sim.alpha(.9).restart(); setTimeout(fitView, 700); }
function fitView() {
